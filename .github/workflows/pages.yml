name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'portfolio.json'
      - 'theses.json'
      - 'history.csv'
      - 'DECISION_LOG.md'
      - 'dashboard/**'
  workflow_dispatch:
  workflow_run:
    workflows: [Weekly Portfolio Round, Intraday Detector]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    # Publish the latest persisted record even if later research reports a gap.
    # A Pages deployment is publication evidence, not assessment-health evidence.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Dashboard
        run: |
          # Generate the HTML dashboard
          python dashboard/build.py
          
          # Prepare the public directory for GitHub Pages
          mkdir -p public
          # Copy it as index.html so it loads by default when visiting the URL
          cp dashboard/thesis-watch.html public/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
