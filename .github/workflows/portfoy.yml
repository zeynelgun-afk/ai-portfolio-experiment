name: Haftalık Portföy Turu

on:
  schedule:
    # Cumartesi 06:00 UTC — Cuma kapanışı sonrası (kural #3: haftalık kapanış bazlı stop)
    - cron: '0 6 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: portfoy-turu
  cancel-in-progress: false

jobs:
  tur:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıklar
        run: pip install yfinance

      - name: 1) Mekanik güncelleme (değerleme + stop kuralı)
        run: python guncelle.py

      - name: 2) Claude karar turu
        if: env.ANTHROPIC_API_KEY != ''
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "HAFTALIK_TALIMAT.md dosyasını oku ve talimatları eksiksiz uygula."
          claude_args: '--allowedTools "Bash,Read,Write,Edit,Glob,Grep" --max-turns 60'

      - name: 3) Raporu tazele
        run: python guncelle.py

      - name: 4) Commit + push
        run: |
          git config user.name "portfoy-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Haftalık tur ($(date +%F))"
          git push

      - name: 5) Stop ihlali bildirimi (Issue)
        if: hashFiles('STOP_IHLALI.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "🛑 Stop ihlali — pozisyon(lar) otomatik kapatıldı ($(date +%F))" \
            --body-file STOP_IHLALI.md

      - name: 6) Telegram raporu
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@TELEGRAM.txt" \
            -o /dev/null -w "Telegram HTTP durum: %{http_code}\n"
