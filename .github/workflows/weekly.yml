name: Weekly Portfolio Round

on:
  schedule:
    # Saturday 06:00 UTC — after the Friday close (the decision round runs on the
    # weekly closing data)
    - cron: '0 6 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: write

concurrency:
  group: portfolio-round
  cancel-in-progress: false

jobs:
  round:
    if: github.ref == 'refs/heads/main' && vars.PORTFOLIO_EXECUTOR == 'local-hermes'
    runs-on: [portfolio-hermes]
    timeout-minutes: 90
    env:
      PROMPT_METRICS_PATH: state/prompt_metrics.json
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_CHAT_ID_DM: ${{ secrets.TELEGRAM_CHAT_ID_DM }}
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: main

      - name: Bind actual checkout baseline before application work
        id: baseline
        env:
          LOCAL_RUNNER_CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
        run: python "$HOME/.local/share/ai-portfolio-runner/local_runner_guard.py" checkout

      - name: Dependencies
        id: dependencies
        run: uv pip install --python "$(command -v python)" -r requirements.txt

      - name: Reconcile corporate actions
        id: corporate
        run: python corporate_actions.py

      - name: Persist corporate-action accounting
        id: corporate_commit
        if: steps.corporate.outputs.changed == 'true'
        run: |
          git config user.name "portfolio-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio.json theses.json state/ CORPORATE_ACTIONS.md
          git diff --cached --quiet || git commit -m "Reconcile corporate actions without investment decisions"
          git push

      - name: Notify persisted corporate actions
        id: corporate_notify
        if: steps.corporate.outputs.changed == 'true'
        env:
          WATCHDOG_MESSAGE: 'AI Portföy: Bölünme/temettü muhasebe kaydı GitHub’a kaydedildi. Alım-satım kararı değildir. Ayrıntılar: CORPORATE_ACTIONS.md'
        run: python notify_failure.py

      - name: 1) Valuation + exit-level warning (makes no decisions)
        id: valuation
        run: python update.py

      - name: Persist valuation before model-dependent research
        id: valuation_commit
        run: |
          git config user.name "portfolio-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add REPORT.md history.csv portfolio.json
          git diff --cached --quiet || git commit -m "Refresh measured valuation before weekly research"
          git push

      - name: Preserve valuation evidence
        id: valuation_evidence
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-valuation
          path: |
            REPORT.md
            history.csv
          retention-days: 90

      - name: 2) Audit the previous rounds — BEFORE this round decides
        id: audit
        # The scorecard and the review read the record as it stood before this round, so
        # the decision-maker walks into the round with its own failure patterns in front
        # of it rather than discovering them a week later. The audit never writes to
        # portfolio.json or theses.json; it only produces AUDIT.md and AUDIT_LOG.md.
        run: python audit.py --review

      - name: Notify independent audit objections
        id: audit_notify
        run: |
          python - <<'PYTHON'
          import json
          from notify_failure import notify
          review = json.load(open('state/audit_disagreements.json'))
          if review['new_count']:
              notify(message='AI Portföy: Tek denetçiden gelen ' + str(review['new_count']) + ' itiraz inceleme kaydına alındı. Ortak karar değildir; otomatik strateji değişikliği uygulanmadı. state/audit_disagreements.json')
          PYTHON

      - name: Measure mature research cohorts
        id: research_metrics
        run: python research_metrics.py

      - name: Adapt evidence reminders
        id: prompt_adapt
        run: |
          set +e
          python prompt_adapt.py
          CODE=$?
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" != "0" ] && [ "$CODE" != "2" ]; then exit "$CODE"; fi
          if [ "$CODE" = "2" ]; then
            git config user.name "portfolio-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/prompt_adaptation.json state/prompt_reminders.md state/prompt_metrics.json
            git commit -m "Roll back regressed prompt reminder"
            git push
          fi

      - name: 2.5) Run Scout Agent (Dynamic Watchlist)
        id: scout
        run: python scout.py

      - name: 3a) Collect measured weekly inputs
        id: weekly_inputs
        run: python weekly_data.py

      - name: 3b) Structured decision — weekend research plan (no trades)
        id: weekly_decision
        run: python weekly_round.py

      - name: Preserve weekly source evidence
        id: weekly_evidence
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-source-evidence
          path: |
            output/scout_input.json
            output/weekly_evidence.json
            weekly_data.json
            state/theme_research_inbox.json
          if-no-files-found: ignore
          retention-days: 90

      - name: 4) Refresh the report
        id: refresh
        run: python update.py

      - name: 5) Commit + push
        id: commit
        run: |
          git config user.name "portfolio-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Weekly round ($(date +%F))"
          git pull --rebase
          git push

      - name: Notify queued weekend research
        id: plan_notify
        env:
          WATCHDOG_MESSAGE: 'AI Portföy: Cumartesi araştırması tamamlandı. Seans dışında alım-satım yapılmadı; plan açık seansta güncel veri ve fiyatla yeniden değerlendirilecek.'
        run: python notify_failure.py

      - name: 6) Propose an instruction amendment for a recurring fault
        id: amend
        # Runs after the push so the branch is cut from the updated default branch.
        # amend.py can only add text to WEEKLY_INSTRUCTIONS.md, only on a branch, and
        # only once per pattern — the guarantees are enforced in code, not asked for in
        # a prompt. Nothing here is ever merged: it proposes, the owner decides.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! CAN_CREATE=$(gh api "repos/$GITHUB_REPOSITORY/actions/permissions/workflow" --jq '.can_approve_pull_request_reviews'); then
            echo "PR capability query unavailable; exporting review artifacts instead."
            CAN_CREATE=false
          fi
          if [ "$CAN_CREATE" = "true" ]; then
            python amend.py
          else
            python amend.py --export-only
          fi

      - name: Preserve prompt proposals for owner review
        id: proposal_evidence
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: prompt-proposals
          path: prompt-proposals/*.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Persist amendment tracking and request proposal tests
        id: amend_commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add state/audit_patterns.json
          if ! git diff --cached --quiet; then
            git commit -m "Record proposed prompt amendments"
            git pull --rebase
            git push
          fi
          python - <<'PY'
          import datetime, json, subprocess
          state = json.load(open('state/audit_patterns.json'))
          today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          for pattern, details in state.items():
              if details.get('proposal_kind') != 'artifact' and str(details.get('proposed_at', '')).startswith(today):
                  branch = 'audit/amend/' + pattern + '-' + today.replace('-', '')
                  subprocess.run(['gh', 'workflow', 'run', 'checks.yml', '--ref', branch], check=True)
          PY

      - name: 7) Exit-level notification (Issue)
        id: exit_notify
        if: hashFiles('STOP_BREACH.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "⚠️ Below the exit level — the AI's decision is in the log ($(date +%F))" \
            --body-file STOP_BREACH.md

      - name: 8) Telegram report
        id: report_notify
        # The send must not fail silently: a weekly report that never arrives inside a
        # green run looks identical to one that did. A non-200 makes the step red.
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          CODE=$(curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@telegram.txt" \
            -o /tmp/telegram_body.txt -w '%{http_code}')
          echo "Telegram HTTP status: ${CODE}"
          if [ "$CODE" != "200" ]; then
            echo "::error title=The weekly Telegram report was not delivered::HTTP ${CODE} — $(cat /tmp/telegram_body.txt)"
            echo "⚠️ The weekly Telegram report was not delivered (HTTP ${CODE})." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 9) Audit reminder
        id: audit_reminder
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          WEEK=$(( ( $(date +%s) - $(date -d 2026-08-05 +%s) ) / 604800 + 1 ))
          if [ "$WEEK" -le 4 ]; then
            EXTRA="In the first 3-4 weeks this audit is the most important work in a fully autonomous system — do not skip it."
          else
            EXTRA="The system has settled; reading the log regularly still protects decision quality."
          fi
          MESSAGE=$(printf '%s\n\n%s\n\n%s\n\n%s\n\n%s' \
            "🔍 Audit reminder (Week ${WEEK})" \
            "Review the decision log: what did the autonomous Claude do this week, and does its reasoning hold up?" \
            "If it needs recalibrating, open a Claude session and say 'let us go through the decision log together' — WEEKLY_INSTRUCTIONS.md is updated jointly." \
            "${EXTRA}" \
            "https://github.com/zeynelgun-afk/ai-portfolio-experiment/blob/main/DECISION_LOG.md")
          CODE=$(curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            -o /dev/null -w '%{http_code}')
          echo "Reminder HTTP status: ${CODE}"
          if [ "$CODE" != "200" ]; then
            echo "::warning title=The audit reminder was not delivered::HTTP ${CODE}"
          fi

      - name: Report automatic prompt rollback
        id: prompt_health
        if: always() && steps.prompt_adapt.outputs.code == '2'
        run: |
          echo "::error::Prompt reminder rolled back after the measured failure rate increased; previous policy restored."
          exit 1

      - name: Report provider failover
        id: provider_health
        if: always() && steps.checkout.outcome == 'success'
        run: python provider_health.py

      - name: Analyst revision evidence health
        id: analyst_health
        if: always() && steps.weekly_inputs.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          data = json.load(open('weekly_data.json'))
          missing = [s for s, row in data.items() if not s.startswith('_') and
                     (row.get('analyst_revisions', {}).get('status') != 'ok' or
                      row.get('analyst_revisions', {}).get('estimates_status') != 'ok')]
          if missing:
              raise SystemExit('Analyst revision evidence incomplete: ' + ', '.join(missing))
          PY

      - name: Preserve provider routing evidence
        id: provider_evidence
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: provider-routing
          path: output/provider-events.jsonl
          if-no-files-found: ignore
          retention-days: 90

      - name: Preserve exact local attempt and release successful claim
        id: finalize
        if: always() && contains(fromJSON('["success","failure","cancelled"]'), steps.checkout.outcome)
        env:
          LOCAL_RUNNER_CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          LOCAL_RUNNER_STEPS: ${{ toJSON(steps) }}
        run: python "$HOME/.local/share/ai-portfolio-runner/local_runner_guard.py" finish --outcome "${{ job.status }}"
