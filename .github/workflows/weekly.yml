name: Haftalık Portföy Turu

on:
  schedule:
    # Cumartesi 06:00 UTC — Cuma kapanışı sonrası (haftalık kapanış verisiyle karar turu)
    - cron: '0 6 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: portfoy-turu
  cancel-in-progress: false

jobs:
  tur:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıklar
        run: pip install yfinance

      - name: 1) Değerleme + çıkış seviyesi uyarısı (karar vermez)
        run: python guncelle.py

      - name: 2) Claude karar turu (OpenRouter üzerinden)
        if: env.OPENROUTER_API_KEY != ''
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_SMALL_FAST_MODEL: anthropic/claude-haiku-4.5
        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          github_token: ${{ github.token }}
          prompt: "HAFTALIK_TALIMAT.md dosyasını oku ve talimatları eksiksiz uygula."
          claude_args: '--allowedTools "Bash,Read,Write,Edit,Glob,Grep" --max-turns 60 --model anthropic/claude-sonnet-4.5'

      - name: 3) Raporu tazele
        run: python guncelle.py

      - name: 4) Commit + push
        run: |
          git config user.name "portfoy-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Haftalık tur ($(date +%F))"
          git push

      - name: 5) Çıkış seviyesi bildirimi (Issue)
        if: hashFiles('STOP_IHLALI.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "⚠️ Çıkış seviyesi altında — AI'ın kararı günlükte ($(date +%F))" \
            --body-file STOP_IHLALI.md

      - name: 6) Telegram raporu
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@TELEGRAM.txt" \
            -o /dev/null -w "Telegram HTTP durum: %{http_code}\n"

      - name: 7) Denetim hatırlatması
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          HAFTA=$(( ( $(date +%s) - $(date -d 2026-08-05 +%s) ) / 604800 + 1 ))
          if [ "$HAFTA" -le 4 ]; then
            EK="İlk 3-4 haftadaki bu denetim, tam otonom sistemin en önemli işi — atlama."
          else
            EK="Sistem oturdu; yine de günlüğü düzenli okumak karar kalitesini korur."
          fi
          MESAJ=$(printf '%s\n\n%s\n\n%s\n\n%s\n\n%s' \
            "🔍 Denetim hatırlatması (Hafta ${HAFTA})" \
            "Karar günlüğünü gözden geçir: otonom Claude bu hafta ne yaptı, gerekçeleri sağlam mı?" \
            "Kalibrasyon gerekirse bir Claude oturumunda 'karar günlüğünü birlikte inceleyelim' de — HAFTALIK_TALIMAT.md birlikte güncellenir." \
            "${EK}" \
            "https://github.com/zeynelgun-afk/ai-portfoy-deneyi/blob/main/KARAR_GUNLUGU.md")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESAJ}" \
            -o /dev/null -w "Hatırlatma HTTP durum: %{http_code}\n"
