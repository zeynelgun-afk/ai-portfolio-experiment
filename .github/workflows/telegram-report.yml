name: Telegram Report (manual)

# Re-sends the current report to Telegram without re-running the weekly round.
# Usage: Actions -> Telegram Report (manual) -> Run workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # telegram.txt is gitignored — build the report inside the runner (no push,
      # no side effects)
      - name: Build the report
        run: |
          pip install yfinance
          python update.py

      - name: Telegram report
        run: |
          CODE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@telegram.txt" \
            -o /tmp/telegram_body.txt -w '%{http_code}')
          echo "Telegram HTTP status: ${CODE}"
          if [ "$CODE" != "200" ]; then
            echo "::error title=The report was not delivered::HTTP ${CODE} — $(cat /tmp/telegram_body.txt)"
            exit 1
          fi

      - name: Audit reminder
        run: |
          WEEK=$(( ( $(date +%s) - $(date -d 2026-08-05 +%s) ) / 604800 + 1 ))
          if [ "$WEEK" -le 4 ]; then
            EXTRA="In the first 3-4 weeks this audit is the most important work in a fully autonomous system — do not skip it."
          else
            EXTRA="The system has settled; reading the log regularly still protects decision quality."
          fi
          MESSAGE=$(printf '%s\n\n%s\n\n%s\n\n%s\n\n%s' \
            "🔍 Audit reminder (Week ${WEEK})" \
            "Review the decision log: what did the autonomous Claude do this week, and does its reasoning hold up?" \
            "If it needs recalibrating, open a Claude session and say 'let us go through the decision log together' — WEEKLY_INSTRUCTIONS.md is updated jointly." \
            "${EXTRA}" \
            "https://github.com/zeynelgun-afk/ai-portfoy-deneyi/blob/main/DECISION_LOG.md")
          CODE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            -o /dev/null -w '%{http_code}')
          echo "Reminder HTTP status: ${CODE}"
