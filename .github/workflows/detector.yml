name: Intraday Detector

# Event-driven reassessment. The Saturday round decides once a week; this workflow asks
# "did the meaning change?" every 30 minutes during the week.
# Data flows continuously, commentary is updated only when the meaning changes.

on:
  schedule:
    # US session, Mon-Fri, every 30 minutes (13:30-20:00 UTC)
    - cron: '30 13 * * 1-5'
    - cron: '0,30 14-19 * * 1-5'
    - cron: '0,30 20 * * 1-5'
    - cron: '0 21 * * 1-5'
    # Post-close full review: every claim is revisited even if no threshold was crossed
    # (for the unknown unknowns — something we never tied to a threshold may have broken)
    - cron: '15 21 * * 1-5'
  workflow_dispatch:
    inputs:
      full_review:
        description: 'Review every claim in bulk (even if no threshold was crossed)'
        type: boolean
        default: false

permissions:
  contents: write

# The SAME concurrency group as the weekly round: the two must never write to
# portfolio.json at the same time. The weekly round runs 06:00 UTC on Saturday and this
# one Mon-Fri, so they do not collide on the calendar, but the group is shared anyway for
# manual runs.
concurrency:
  group: portfolio-round
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    env:
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      OPENROUTER_MODEL_MACRO: ${{ vars.OPENROUTER_MODEL_MACRO }}
      OPENROUTER_MODEL_FUNDAMENTAL: ${{ vars.OPENROUTER_MODEL_FUNDAMENTAL }}
      OPENROUTER_MODEL_SENTIMENT: ${{ vars.OPENROUTER_MODEL_SENTIMENT }}
      OPENROUTER_MODEL_REVIEW: ${{ vars.OPENROUTER_MODEL_REVIEW }}
      OPENROUTER_MODEL_WEEKLY: ${{ vars.OPENROUTER_MODEL_WEEKLY }}
      PROMPT_METRICS_PATH: state/prompt_metrics.json
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL_NEWS: ${{ vars.OPENROUTER_MODEL_NEWS }}
      OPENROUTER_MODEL_FAST: ${{ vars.OPENROUTER_MODEL_FAST }}
      OPENROUTER_MODEL_DEEP: ${{ vars.OPENROUTER_MODEL_DEEP }}
      MAX_LLM_CALLS_PER_WEEK: ${{ vars.MAX_LLM_CALLS_PER_WEEK }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_CHAT_ID_DM: ${{ secrets.TELEGRAM_CHAT_ID_DM }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies
        run: pip install -r requirements.txt

      - name: Determine the mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "15 21 * * 1-5" ] \
             || [ "${{ inputs.full_review }}" = "true" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "Mode: full review (every claim will be revisited)"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "Mode: event-driven (only claims whose threshold was crossed)"
          fi

      - name: Exchange session gate
        id: session
        env:
          FULL_REVIEW: ${{ steps.mode.outputs.full }}
        run: python market_time.py

      - name: Reconcile corporate actions
        if: steps.session.outputs.run == 'true'
        id: corporate
        run: python corporate_actions.py

      - name: Persist corporate-action accounting
        if: steps.corporate.outputs.changed == 'true'
        run: |
          git config user.name "portfolio-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio.json theses.json state/ CORPORATE_ACTIONS.md
          git diff --cached --quiet || git commit -m "Reconcile corporate actions without investment decisions"
          git push

      - name: Notify persisted corporate actions
        if: steps.corporate.outputs.changed == 'true'
        env:
          WATCHDOG_MESSAGE: 'AI Portföy: Bölünme/temettü muhasebe kaydı GitHub’a kaydedildi. Alım-satım kararı değildir. Ayrıntılar: CORPORATE_ACTIONS.md'
        run: python notify_failure.py

      - name: Reassess and execute pending weekly research in-session
        if: steps.session.outputs.run == 'true'
        id: weekly_execution
        run: python weekly_round.py --execute-pending

      - name: Persist session execution before further analysis
        if: steps.weekly_execution.outputs.executed == 'true'
        run: |
          git config user.name "portfolio-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio.json theses.json DECISION_LOG.md state/
          git diff --cached --quiet || git commit -m "Execute weekly research after session reassessment"
          git push

      - name: Notify weekly session execution
        if: steps.weekly_execution.outputs.executed == 'true'
        env:
          WATCHDOG_MESSAGE: 'AI Portföy: Cumartesi araştırması açık seansta güncel veriyle yeniden değerlendirildi. Kabul edilen işlemler ve HOLD kararları DECISION_LOG.md dosyasına kaydedildi.'
        run: python notify_failure.py

      - name: Preserve weekly session evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-session-evidence
          path: output/weekly_evidence.json
          if-no-files-found: ignore
          retention-days: 90

      - name: 1) Detector — measure conditions and assess news
        if: steps.session.outputs.run == 'true'
        id: detector
        run: |
          : "${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is required for news assessment}"
          set +e
          if [ "${{ steps.mode.outputs.full }}" = "true" ]; then
            python detector.py --full-review
          else
            python detector.py
          fi
          CODE=$?
          set -e
          case "$CODE" in
            0|10|20) echo "code=$CODE" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Detector failed with exit code $CODE"; exit "$CODE" ;;
          esac

      - name: 2) Reassessment (only when a threshold was crossed)
        if: (steps.detector.outputs.code == '10' || steps.detector.outputs.code == '20') && env.OPENROUTER_API_KEY != ''
        id: reassess
        run: |
          if [ "${{ steps.mode.outputs.full }}" = "true" ]; then
            python reassess.py --code "${{ steps.detector.outputs.code }}" --full-review
          else
            python reassess.py --code "${{ steps.detector.outputs.code }}"
          fi

      - name: Preserve intraday source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-source-evidence
          path: output/intraday_evidence.json
          if-no-files-found: ignore
          retention-days: 90

      - name: 3) Execute the decision (autonomous intraday trade)
        if: steps.reassess.outputs.decision_count != '' && steps.reassess.outputs.decision_count != '0'
        id: trade
        run: python execute_trade.py

      - name: 4) Refresh the report after trades or corporate actions
        if: steps.trade.outputs.monitoring_changed == 'true' || steps.corporate.outputs.changed == 'true' || steps.weekly_execution.outputs.executed == 'true' || (steps.trade.outputs.trade_count != '' && steps.trade.outputs.trade_count != '0')
        run: python update.py

      - name: Adapt evidence reminders
        if: steps.reassess.outcome == 'success'
        id: prompt_adapt
        run: |
          set +e
          python prompt_adapt.py
          CODE=$?
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" != "0" ] && [ "$CODE" != "2" ]; then exit "$CODE"; fi
          if [ "$CODE" = "2" ]; then
            git config user.name "portfolio-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/prompt_adaptation.json state/prompt_reminders.md state/prompt_metrics.json
            git commit -m "Roll back regressed prompt reminder"
            git push
          fi

      - name: Measure mature research cohorts
        if: steps.session.outputs.run == 'true' && steps.mode.outputs.full == 'true'
        run: python research_metrics.py

      - name: 5) Commit + push
        if: steps.detector.outcome == 'success'
        id: commit
        env:
          SUMMARY: ${{ steps.detector.outputs.trigger_summary }}
          TRADE: ${{ steps.trade.outputs.trade_summary }}
        run: |
          if [ "${{ steps.detector.outputs.code }}" = "0" ] \
             && [ "${{ steps.detector.outputs.state_changed }}" != "true" ] \
             && [ "${{ steps.weekly_execution.outputs.executed }}" != "true" ] \
             && [ "${{ steps.corporate.outputs.changed }}" != "true" ] \
             && [ "${{ steps.mode.outputs.full }}" != "true" ]; then
            # Nothing meaningful changed: the hysteresis counters are identical too, so
            # discarding the state file loses nothing. Committing an empty change every
            # 30 minutes would drown the audit trail.
            git checkout -- . || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No meaningful change — commit skipped"
            exit 0
          fi
          git config user.name "Finzora AI"
          git config user.email "finzora-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No file differences — commit skipped"
            exit 0
          fi
          MESSAGE="[bot/detector] intraday check (code ${{ steps.detector.outputs.code }})"
          if [ -n "$TRADE" ] && [ "$TRADE" != "none" ]; then
            MESSAGE="$MESSAGE — trade: $TRADE"
          fi
          git commit -m "$MESSAGE" -m "Trigger: ${SUMMARY:-none}"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 6) Telegram — thesis-level / trade notification (DM)
        # A thesis-level trigger means an entire thesis is in question; it wakes Zeynel's
        # DM rather than the group channel. Claim-level triggers go out in bulk in the
        # 21:15 summary.
        #
        # The DM must never fail silently. Telegram forbids a bot from sending the FIRST
        # message to a user: if no private chat has been opened with the experiment's bot,
        # the call returns 400/403. In that case the notification falls back to the group
        # channel and the fallback is recorded both in the log and in the job summary — a
        # lost thesis-level alert is worse than never having built the alert.
        if: (steps.detector.outputs.code == '20' || (steps.reassess.outputs.decision_count != '' && steps.reassess.outputs.decision_count != '0')) && env.TELEGRAM_BOT_TOKEN != ''
        env:
          TRADE: ${{ steps.trade.outputs.trade_summary }}
          TRIGGER_SUMMARY: ${{ steps.detector.outputs.trigger_summary }}
          THESIS_SYMBOLS: ${{ steps.detector.outputs.thesis_symbols }}
        run: |
          REJECTED="${{ steps.trade.outputs.rejected_count }}"
          MESSAGE=$(python - <<'PYTHON'
          import json
          state=json.load(open('state/violations.json'))
          lines=['AI Portföy — karar yeniden değerlendirildi']
          for change in state.get('decision_changes',[]):
              lines += [change['symbol']+' → '+change['action'],
                        'Ne değişti: '+change['trigger'][:400],
                        'Kararın gerekçesi: '+change['reasoning'][:600],
                        'Yanlışlanma koşulu: '+change['falsifier'][:400],
                        'Sonraki inceleme: '+change['after'].get('monitoring',{}).get('next_review_at','weekly round')]
          if not state.get('decision_changes'):lines.append('İnceleme tamamlanamadı; kanıt ve hata kayıtlarını kontrol edin.')
          lines += ['İşlem sonucu: '+__import__('os').environ.get('TRADE','none'),
                    'https://github.com/zeynelgun-afk/ai-portfolio-experiment/blob/main/DECISION_LOG.md']
          print('\n'.join(lines)[:3500])
          PYTHON
          )

          send() {  # $1 = chat_id, $2 = text -> prints the body, then the HTTP code
            curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=$1" --data-urlencode "text=$2" \
              -w '\n%{http_code}'
          }

          DELIVERED=0
          if [ -n "${TELEGRAM_CHAT_ID_DM}" ]; then
            RESPONSE=$(send "${TELEGRAM_CHAT_ID_DM}" "${MESSAGE}") || true
            CODE=$(printf '%s' "$RESPONSE" | tail -n1)
            BODY=$(printf '%s' "$RESPONSE" | sed '$d')
            echo "DM HTTP status: ${CODE}"
            if [ "$CODE" = "200" ]; then
              DELIVERED=1
            else
              echo "::warning title=Thesis-level DM failed::HTTP ${CODE} — ${BODY}"
              echo "⚠️ Thesis-level DM failed (HTTP ${CODE}): ${BODY}" >> "$GITHUB_STEP_SUMMARY"
              echo "Telegram does not let a bot send the first message to a user — send /start to the experiment's bot once." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning title=TELEGRAM_CHAT_ID_DM is not set::Falling back to the group channel"
          fi

          if [ "$DELIVERED" = "0" ] && [ -n "${TELEGRAM_CHAT_ID}" ]; then
            FALLBACK=$(printf '%s\n\n%s' "⚠️ (the DM could not be reached, falling back to the group channel)" "${MESSAGE}")
            RESPONSE=$(send "${TELEGRAM_CHAT_ID}" "${FALLBACK}") || true
            CODE=$(printf '%s' "$RESPONSE" | tail -n1)
            BODY=$(printf '%s' "$RESPONSE" | sed '$d')
            echo "Fallback channel HTTP status: ${CODE}"
            if [ "$CODE" = "200" ]; then
              DELIVERED=1
              echo "ℹ️ The notification went to the fallback channel (group)." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning title=The fallback channel failed too::HTTP ${CODE} — ${BODY}"
              echo "⚠️ The fallback channel failed too (HTTP ${CODE}): ${BODY}" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          # If no channel held, the step goes RED. The trade was already executed and
          # written to DECISION_LOG.md; what is lost is knowing about it, and hiding that
          # inside a green run is not acceptable.
          if [ "$DELIVERED" = "0" ]; then
            echo "::error title=The thesis-level notification reached no channel::The decision was written to DECISION_LOG.md but the notification was dropped — check the secrets and the bot chat"
            exit 1
          fi
          echo "Thesis-level notification delivered."

      - name: 7) Telegram — the daily 21:15 summary (claim level, in bulk)
        if: steps.session.outputs.run == 'true' && steps.mode.outputs.full == 'true' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          python - <<'PY' > /tmp/summary.txt
          import json
          state = json.load(open("state/violations.json", encoding="utf-8"))
          theses = json.load(open("theses.json", encoding="utf-8"))
          lines = ["🕘 Daily thesis summary — " + state.get("checked_at", "")]
          for symbol, position in theses.items():
              if symbol.startswith("_"):
                  continue
              for claim in position.get("claims", []):
                  mark = {"valid": "✅", "weakened": "🟡", "invalid": "🔴"}.get(
                      claim.get("status"), "❔")
                  lines.append(f"{mark} {claim['id']}: {claim.get('status')}"
                               + (f" — {claim['trigger']}" if claim.get("trigger") else ""))
          pending = [key for key, value in state.get("conditions", {}).items()
                     if value.get("breach") and not value.get("confirmed")]
          if pending:
              lines.append("\nConditions awaiting confirmation: " + ", ".join(sorted(pending)))
          lines.append("\nhttps://github.com/zeynelgun-afk/ai-portfolio-experiment/blob/main/theses.json")
          print("\n".join(lines))
          PY
          curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@/tmp/summary.txt" \
            -o /dev/null -w "Summary HTTP status: %{http_code}\n"

      - name: Summarize complete and partial assessment results
        if: always() && steps.session.outputs.run == 'true'
        env:
          DETECTOR_OUTCOME: ${{ steps.detector.outcome }}
          REASSESS_OUTCOME: ${{ steps.reassess.outcome }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import json
          from pathlib import Path
          fresh = os.environ.get('DETECTOR_OUTCOME') == 'success'
          state = json.loads(Path('state/violations.json').read_text()) if fresh and Path('state/violations.json').exists() else {}
          reassess = sorted(set(state.get('assessment_errors', [])))
          news = state.get('news_errors', [])
          measurement = state.get('measurement_errors', [])
          stopped = not fresh or os.environ.get('REASSESS_OUTCOME') == 'failure'
          partial = bool(reassess or news or measurement)
          print('## Assessment status')
          if stopped: print('**INCOMPLETE — detector or reassessment stopped before a fresh result was completed**')
          elif partial: print('**PARTIAL — some assessments remain pending**')
          else: print('**COMPLETE — no assessment errors recorded**')
          if reassess: print('- Reassessment errors: ' + ', '.join(reassess))
          for label, items in (('News/research', news), ('Measurement', measurement)):
              for item in items[:20]:
                  if isinstance(item, dict):
                      detail = str(item.get('symbol', 'unknown')) + ': ' + str(item.get('error', item.get('detail', 'incomplete evidence')))
                  else: detail = str(item)
                  print('- ' + label + ' issue: ' + detail[:240])
          if partial or stopped: print('- Valid independent decisions and records may already have been saved. Check the decision log and run details before taking any follow-up action; failed assessments remain eligible for retry.')
          PY

      - name: Reassessment health
        if: always() && steps.reassess.outputs.error_count != '' && steps.reassess.outputs.error_count != '0'
        run: |
          echo "::error::PARTIAL RUN: some assessments were saved, but one or more claims or theses remain unassessed. Check the Assessment status summary; failed items remain eligible for retry."
          exit 1

      - name: News assessment health
        id: news_health
        if: always() && (steps.detector.outputs.news_error_count != '' && steps.detector.outputs.news_error_count != '0' || steps.detector.outputs.measurement_error_count != '' && steps.detector.outputs.measurement_error_count != '0')
        run: |
          echo "::error::PARTIAL RUN: news, provider coverage, or measurements were incomplete. See the Assessment status summary, state/violations.json, and ANALYST_REVISIONS.md."
          exit 1

      - name: Report automatic prompt rollback
        if: always() && steps.prompt_adapt.outputs.code == '2'
        run: |
          echo "::error::Prompt reminder rolled back after the measured failure rate increased; previous policy restored."
          exit 1

      - name: Report provider failover
        if: always()
        run: python provider_health.py

      - name: Preserve provider routing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-routing
          path: output/provider-events.jsonl
          if-no-files-found: ignore
          retention-days: 90
