name: Intraday Detector

# Event-driven reassessment. The Saturday round decides once a week; this workflow asks
# "did the meaning change?" every 30 minutes during the week.
# Data flows continuously, commentary is updated only when the meaning changes.

on:
  schedule:
    # US session, Mon-Fri, every 30 minutes (13:30-20:00 UTC)
    - cron: '30 13 * * 1-5'
    - cron: '0,30 14-19 * * 1-5'
    - cron: '0 20 * * 1-5'
    # Post-close full review: every claim is revisited even if no threshold was crossed
    # (for the unknown unknowns — something we never tied to a threshold may have broken)
    - cron: '15 21 * * 1-5'
  workflow_dispatch:
    inputs:
      full_review:
        description: 'Review every claim in bulk (even if no threshold was crossed)'
        type: boolean
        default: false

permissions:
  contents: write

# The SAME concurrency group as the weekly round: the two must never write to
# portfolio.json at the same time. The weekly round runs 06:00 UTC on Saturday and this
# one Mon-Fri, so they do not collide on the calendar, but the group is shared anyway for
# manual runs.
concurrency:
  group: portfolio-round
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL_FAST: ${{ vars.OPENROUTER_MODEL_FAST }}
      OPENROUTER_MODEL_DEEP: ${{ vars.OPENROUTER_MODEL_DEEP }}
      MAX_LLM_CALLS_PER_WEEK: ${{ vars.MAX_LLM_CALLS_PER_WEEK }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_CHAT_ID_DM: ${{ secrets.TELEGRAM_CHAT_ID_DM }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies
        run: pip install yfinance

      - name: Determine the mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "15 21 * * 1-5" ] \
             || [ "${{ inputs.full_review }}" = "true" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "Mode: full review (every claim will be revisited)"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "Mode: event-driven (only claims whose threshold was crossed)"
          fi

      - name: 1) Detector — measure the conditions (deterministic, no LLM)
        id: detector
        run: |
          set +e
          if [ "${{ steps.mode.outputs.full }}" = "true" ]; then
            python detector.py --full-review
          else
            python detector.py
          fi
          echo "code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: 2) Reassessment (only when a threshold was crossed)
        if: steps.detector.outputs.code != '0' && env.OPENROUTER_API_KEY != ''
        id: reassess
        run: |
          if [ "${{ steps.mode.outputs.full }}" = "true" ]; then
            python reassess.py --code "${{ steps.detector.outputs.code }}" --full-review
          else
            python reassess.py --code "${{ steps.detector.outputs.code }}"
          fi

      - name: 3) Execute the decision (autonomous intraday trade)
        if: steps.detector.outputs.code == '20'
        id: trade
        run: python execute_trade.py

      - name: 4) Refresh the report (only if a trade happened)
        if: steps.trade.outputs.trade_count != '' && steps.trade.outputs.trade_count != '0'
        run: python update.py

      - name: 5) Commit + push
        id: commit
        run: |
          if [ "${{ steps.detector.outputs.code }}" = "0" ] \
             && [ "${{ steps.detector.outputs.state_changed }}" != "true" ]; then
            # Nothing meaningful changed: the hysteresis counters are identical too, so
            # discarding the state file loses nothing. Committing an empty change every
            # 30 minutes would drown the audit trail.
            git checkout -- . || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No meaningful change — commit skipped"
            exit 0
          fi
          git config user.name "Finzora AI"
          git config user.email "finzora-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No file differences — commit skipped"
            exit 0
          fi
          SUMMARY="${{ steps.detector.outputs.trigger_summary }}"
          TRADE="${{ steps.trade.outputs.trade_summary }}"
          MESSAGE="[bot/detector] intraday check (code ${{ steps.detector.outputs.code }})"
          if [ -n "$TRADE" ] && [ "$TRADE" != "none" ]; then
            MESSAGE="$MESSAGE — trade: $TRADE"
          fi
          git commit -m "$MESSAGE" -m "Trigger: ${SUMMARY:-none}"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 6) Telegram — thesis-level / trade notification (DM)
        # A thesis-level trigger means an entire thesis is in question; it wakes Zeynel's
        # DM rather than the group channel. Claim-level triggers go out in bulk in the
        # 21:15 summary.
        #
        # The DM must never fail silently. Telegram forbids a bot from sending the FIRST
        # message to a user: if no private chat has been opened with the experiment's bot,
        # the call returns 400/403. In that case the notification falls back to the group
        # channel and the fallback is recorded both in the log and in the job summary — a
        # lost thesis-level alert is worse than never having built the alert.
        if: steps.detector.outputs.code == '20' && env.TELEGRAM_BOT_TOKEN != ''
        run: |
          TRADE="${{ steps.trade.outputs.trade_summary }}"
          REJECTED="${{ steps.trade.outputs.rejected_count }}"
          MESSAGE=$(printf '%s\n\n%s\n\n%s\n%s\n\n%s\n\n%s' \
            "🔴 THESIS LEVEL — intraday reassessment" \
            "Trigger: ${{ steps.detector.outputs.trigger_summary }}" \
            "Position(s): ${{ steps.detector.outputs.thesis_symbols }}" \
            "Trade executed: ${TRADE:-none} · decisions not executed: ${REJECTED:-0}" \
            "The reasoning and the falsifier are in the S# entry in DECISION_LOG.md." \
            "https://github.com/zeynelgun-afk/ai-portfolio-experiment/blob/main/DECISION_LOG.md")

          send() {  # $1 = chat_id, $2 = text -> prints the body, then the HTTP code
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=$1" --data-urlencode "text=$2" \
              -w '\n%{http_code}'
          }

          DELIVERED=0
          if [ -n "${TELEGRAM_CHAT_ID_DM}" ]; then
            RESPONSE=$(send "${TELEGRAM_CHAT_ID_DM}" "${MESSAGE}")
            CODE=$(printf '%s' "$RESPONSE" | tail -n1)
            BODY=$(printf '%s' "$RESPONSE" | sed '$d')
            echo "DM HTTP status: ${CODE}"
            if [ "$CODE" = "200" ]; then
              DELIVERED=1
            else
              echo "::warning title=Thesis-level DM failed::HTTP ${CODE} — ${BODY}"
              echo "⚠️ Thesis-level DM failed (HTTP ${CODE}): ${BODY}" >> "$GITHUB_STEP_SUMMARY"
              echo "Telegram does not let a bot send the first message to a user — send /start to the experiment's bot once." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning title=TELEGRAM_CHAT_ID_DM is not set::Falling back to the group channel"
          fi

          if [ "$DELIVERED" = "0" ] && [ -n "${TELEGRAM_CHAT_ID}" ]; then
            FALLBACK=$(printf '%s\n\n%s' "⚠️ (the DM could not be reached, falling back to the group channel)" "${MESSAGE}")
            RESPONSE=$(send "${TELEGRAM_CHAT_ID}" "${FALLBACK}")
            CODE=$(printf '%s' "$RESPONSE" | tail -n1)
            BODY=$(printf '%s' "$RESPONSE" | sed '$d')
            echo "Fallback channel HTTP status: ${CODE}"
            if [ "$CODE" = "200" ]; then
              DELIVERED=1
              echo "ℹ️ The notification went to the fallback channel (group)." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning title=The fallback channel failed too::HTTP ${CODE} — ${BODY}"
              echo "⚠️ The fallback channel failed too (HTTP ${CODE}): ${BODY}" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          # If no channel held, the step goes RED. The trade was already executed and
          # written to DECISION_LOG.md; what is lost is knowing about it, and hiding that
          # inside a green run is not acceptable.
          if [ "$DELIVERED" = "0" ]; then
            echo "::error title=The thesis-level notification reached no channel::The decision was written to DECISION_LOG.md but the notification was dropped — check the secrets and the bot chat"
            exit 1
          fi
          echo "Thesis-level notification delivered."

      - name: 7) Telegram — the daily 21:15 summary (claim level, in bulk)
        if: steps.mode.outputs.full == 'true' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          python - <<'PY' > /tmp/summary.txt
          import json
          state = json.load(open("state/violations.json", encoding="utf-8"))
          theses = json.load(open("theses.json", encoding="utf-8"))
          lines = ["🕘 Daily thesis summary — " + state.get("checked_at", "")]
          for symbol, position in theses.items():
              if symbol.startswith("_"):
                  continue
              for claim in position.get("claims", []):
                  mark = {"valid": "✅", "weakened": "🟡", "invalid": "🔴"}.get(
                      claim.get("status"), "❔")
                  lines.append(f"{mark} {claim['id']}: {claim.get('status')}"
                               + (f" — {claim['trigger']}" if claim.get("trigger") else ""))
          pending = [key for key, value in state.get("conditions", {}).items()
                     if value.get("breach") and not value.get("confirmed")]
          if pending:
              lines.append("\nConditions awaiting confirmation: " + ", ".join(sorted(pending)))
          lines.append("\nhttps://github.com/zeynelgun-afk/ai-portfolio-experiment/blob/main/theses.json")
          print("\n".join(lines))
          PY
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@/tmp/summary.txt" \
            -o /dev/null -w "Summary HTTP status: %{http_code}\n"
